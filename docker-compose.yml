version: '3.8'

services:
  # 1. Frontend Web Presentation Layer (Nginx + Optimized SPA Chunks)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ad_cloud_ai_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. Enterprise API Gateway & Autonomous Multi-Agent Service
  api:
    image: node:20-alpine
    container_name: ad_cloud_ai_api
    restart: always
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./:/app
      - api_data:/app/server/data
    command: ["node", "server/server.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  api_data:
